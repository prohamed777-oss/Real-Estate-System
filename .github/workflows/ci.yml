name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/revenue_os_test
      AUTH_DEV_ENABLED: "true"
      CRON_SECRET: test-cron-secret
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app tests
      - name: Migrations apply cleanly (alembic upgrade head)
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base || true
          uv run alembic upgrade head
      - name: Tests (invariants + concurrency + golden flow)
        working-directory: backend
        run: uv run pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint
        working-directory: frontend
        run: pnpm lint || true
      - name: Build
        working-directory: frontend
        run: pnpm build
